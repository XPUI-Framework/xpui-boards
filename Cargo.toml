# The devices this framework has been described for, one crate per vendor.
#
# `core` is the vocabulary and describes no device; each vendor crate is data
# written in it and knows nothing of the others. A project depends on the
# vendor it targets, and on none of the rest.
[workspace]
# `xtask` is the gate. A member rather than a separate workspace so one
# `cargo test` reaches its tests.
members = ["core", "pimoroni", "seeed", "xteink", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-boards"

[workspace.dependencies]
# A git dependency, not a version: nothing is published, and a fresh clone of
# this repository has to build without its siblings on disk.
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main" }
xpui-boards-core = { path = "core" }
xpui-boards-pimoroni = { path = "pimoroni" }
xpui-boards-seeed = { path = "seeed" }
xpui-boards-xteink = { path = "xteink" }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
too_long_first_doc_paragraph = "deny"

[workspace.lints.rustdoc]
unescaped_backticks = "deny"

# What a `cargo build --release` of this repository alone produces — not what
# ships. A library's profile applies only at the top of a build; a firmware's
# workspace sets the profile for everything it links; `xpui-rp2040`,
# `xpui-esp32` and `xpui-cpp` use `opt-level = "z"`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
