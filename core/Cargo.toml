[package]
name = "xpui-boards-core"
description = "The vocabulary a device description is written in: panel, keys, bezel, millimetres"
readme = "README.md"
keywords = ["ui", "embedded", "no-std", "eink", "xpui"]
categories = ["embedded", "gui", "no-std"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "xpui_boards_core"
crate-type = ["rlib"]

[dependencies]
# The only one. `Button` and `KeyRow` are what a device description needs to say
# which key sends what — and after spec 37 that is all it says. It borrows
# nothing from the crate that paints, because how large a row should look is the
# application's decision and not the panel's.
xpui.workspace = true

[dev-dependencies]
# For the README's example only: this crate's whole point is that the devices
# are elsewhere, and the front door has to be able to show the real path a
# reader takes.
#
# **By path, with no version**, deliberately — not `.workspace = true`, which
# would carry one. A dev-dependency that names a version is resolved from the
# registry when the crate is published, so `cargo publish -p xpui-boards-core`
# would want `xpui-boards-pimoroni` on crates.io and vice versa, and neither
# could go first. A path-only dev-dependency is stripped from the published
# manifest entirely, and `cargo build`/`cargo test` are unaffected either way.
xpui-boards-pimoroni = { path = "../pimoroni" }
