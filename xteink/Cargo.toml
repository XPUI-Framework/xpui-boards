[package]
name = "xpui-boards-xteink"
description = "Xteink devices, described for xpui: X3, X4 and X4 Pro"
readme = "README.md"
keywords = ["ui", "embedded", "no-std", "eink", "xpui"]
categories = ["embedded", "gui", "no-std"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "xpui_boards_xteink"
crate-type = ["rlib"]

[dependencies]
# The vocabulary. This crate is data written in it and holds no logic of its
# own — which is why one vendor's boards can be taken without the others.
xpui-boards-core.workspace = true
# `Button` and `KeyRow`: what a key sends, and what the row along the bottom
# means. A device description says nothing else about the framework.
xpui.workspace = true
